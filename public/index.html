<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLACE AGI Platform</title>
  <link rel="stylesheet" href="css/enterprise.css">
</head>
<body>
  <div class="solace-layout">
    <!-- Sidebar Navigation -->
    <aside class="solace-sidebar">
      <div class="sidebar-header">
        <h2>SOLACE</h2>
        <span class="version-badge">v2.6 AGI</span>
      </div>
      <div class="sidebar-nav">
        <button class="nav-item active">Neural Core Node</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="solace-main">
      <header class="chat-header">
        <h1>Autonomous Intelligence Platform</h1>
        <div class="telemetry-pill">Token Window: 6.4B | Cost: $0.00</div>
      </header>

      <!-- Message History Container -->
      <div id="chat-feed" class="chat-feed">
        <div class="message assistant">
          <div class="msg-author">SOLACE Core</div>
          <div class="msg-content">Neural link established. Ready for instructions.</div>
        </div>
      </div>

      <!-- Input Controls -->
      <div class="chat-input-area">
        <textarea id="user-prompt" placeholder="Enter query or instructions..." rows="2"></textarea>
        <button id="send-btn" onclick="sendMessage()">Transmit</button>
      </div>
    </main>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-prompt");
      const feed = document.getElementById("chat-feed");
      const promptText = input.value.trim();
      
      if (!promptText) return;

      feed.innerHTML += `
        <div class="message user">
          <div class="msg-author">You</div>
          <div class="msg-content">${escapeHtml(promptText)}</div>
        </div>`;
      input.value = "";
      feed.scrollTop = feed.scrollHeight;

      try {
        const res = await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await res.json();

        feed.innerHTML += `
          <div class="message assistant">
            <div class="msg-author">SOLACE Core</div>
            <div class="msg-content">${escapeHtml(data.response || "No response received.")}</div>
          </div>`;
      } catch (err) {
        feed.innerHTML += `
          <div class="message assistant error">
            <div class="msg-author">System Error</div>
            <div class="msg-content">Exception: ${err.message}</div>
          </div>`;
      }
      feed.scrollTop = feed.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
