<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolaceTech — SOLACE AI+ Enterprise Platform</title>
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap](https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
</head>
<body>

    <div class="app-window">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="appSidebar">
            <div class="brand-header">
                <div class="brand-logo" onclick="location.reload()">
                    <div class="brand-badge">S</div> SOLACE AI+
                </div>
                <button class="tool-btn" onclick="toggleTheme()">🌙</button>
            </div>

            <button class="btn-new-chat" onclick="location.reload()">+ New Thread</button>

            <div class="history-group">
                <div class="history-item active">💬 Production Edge AI Session</div>
            </div>

            <div style="margin-top:auto; display:flex; gap:10px; align-items:center;">
                <div class="user-avatar-sm" id="sidebarUserAvatar">SC</div>
                <span id="userNameDisplay" style="font-size:13px; font-weight:700;">Samrat Chaudhary</span>
            </div>
        </aside>

        <!-- MAIN CHAT -->
        <main class="main-chat-container">
            <div class="chat-topbar">
                <div style="font-weight:800; font-size:14px;">SOLACE AI+ Platform</div>
                <div style="font-size:12px; background:var(--accent-purple-light); color:var(--accent-purple); padding:4px 12px; border-radius:20px; font-weight:700;">⚡ Llama 3.2 3B Edge</div>
            </div>

            <div class="chat-messages-wrapper" id="chatMessagesWrapper">
                <div style="background:var(--bg-card); padding:20px; border-radius:16px; border:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h2 style="font-size:18px; font-weight:800;">SolaceTech Enterprise Platform</h2>
                        <p style="font-size:13px; color:var(--text-muted);">Fully modular: Voice I/O, Code Execution, Custom Plugins, and Memory Profiles.</p>
                    </div>
                    <div id="threeCanvasContainer"></div>
                </div>
            </div>

            <!-- FLOATING INPUT -->
            <div class="input-floating-container">
                <div class="input-floating-bar">
                    <textarea class="chat-textarea" id="userChatInput" placeholder="Message SOLACE AI+ or ask to run code..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-tools-bar">
                        <button class="tool-btn" onclick="triggerVoiceInput()">🎙️ Voice Input</button>
                        <button class="tool-btn" onclick="alert('Plugins active: Code Runner')">🧩 Plugins Active</button>
                        <button class="btn-new-chat" style="width:auto; padding:6px 16px;" onclick="sendUserMessage()">Send ➔</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/three-orb.js"></script>
    <script src="/assets/js/voice.js"></script>
    <script src="/assets/js/plugins.js"></script>
    <script src="/assets/js/app.js"></script>
</body>
</html>
